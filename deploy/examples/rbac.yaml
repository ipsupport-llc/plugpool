apiVersion: v1
kind: ServiceAccount
metadata:
  name: cluster-autoscaler
  namespace: plugpool
---
# cluster-autoscaler's rules (from the upstream Helm chart 9.59.0) plus
# plugpool's: delete Node objects of powered-off machines.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-autoscaler-plugpool
rules:
  - apiGroups: [""]
    resources: [events, endpoints]
    verbs: [create, patch]
  - apiGroups: [""]
    resources: [pods/eviction]
    verbs: [create]
  - apiGroups: [""]
    resources: [pods/status]
    verbs: [update]
  - apiGroups: [""]
    resources: [endpoints]
    resourceNames: [cluster-autoscaler]
    verbs: [get, update]
  - apiGroups: [""]
    resources: [nodes]
    verbs: [watch, list, get, update, delete]
  - apiGroups: [""]
    resources: [podtemplates]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [resource.k8s.io]
    resources: [resourceslices, deviceclasses, resourceclaims]
    verbs: [watch, list, get]
  - apiGroups: [""]
    resources: [namespaces, pods, services, replicationcontrollers, persistentvolumeclaims, persistentvolumes]
    verbs: [watch, list, get]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [watch, list, get]
  - apiGroups: [batch, extensions]
    resources: [jobs]
    verbs: [get, list, patch, watch]
  - apiGroups: [extensions]
    resources: [replicasets, daemonsets]
    verbs: [watch, list, get]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [watch, list]
  - apiGroups: [apps]
    resources: [daemonsets, deployments, replicasets, statefulsets]
    verbs: [watch, list, get]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses, csinodes, csidrivers, csistoragecapacities, volumeattachments]
    verbs: [watch, list, get]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [list, watch, get]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [create]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    resourceNames: [cluster-autoscaler]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-autoscaler-plugpool
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-autoscaler-plugpool
subjects:
  - kind: ServiceAccount
    name: cluster-autoscaler
    namespace: plugpool
---
# cluster-autoscaler's status ConfigMap, plugpool's poweroff pods and its
# ConfigMap of DRA device snapshots.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cluster-autoscaler-plugpool
  namespace: plugpool
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [create]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [cluster-autoscaler-status, plugpool-template-slices]
    verbs: [delete, get, update]
  - apiGroups: [""]
    resources: [pods]
    verbs: [create, list, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cluster-autoscaler-plugpool
  namespace: plugpool
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cluster-autoscaler-plugpool
subjects:
  - kind: ServiceAccount
    name: cluster-autoscaler
    namespace: plugpool
